name: Buduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Zależności
        run: npm install

      - name: Projekt Androida
        run: npx cap add android && npx cap sync android

      - name: Ikona aplikacji
        run: |
          cp -r resources/android-res/* android/app/src/main/res/

      - name: Budowanie
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Nazwa pliku
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kieszonkowy-waz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kieszonkowy-waz-apk
          path: kieszonkowy-waz.apk

      - name: Wydanie z APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kieszonkowy Wąż (build ${{ github.run_number }})
          files: kieszonkowy-waz.apk
